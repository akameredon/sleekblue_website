# Auto-deploy staging to Hostinger from the staging branch.
# ONE-TIME SETUP (GitHub → Settings → Secrets and variables → Actions):
#   HOSTINGER_STAGING_HOST      e.g. 123.456.789.10 or ssh.yourdomain.com
#   HOSTINGER_STAGING_USER      SSH username for staging server
#   HOSTINGER_STAGING_SSH_KEY   private key (full PEM, including BEGIN/END lines)
#   HOSTINGER_STAGING_APP_PATH  absolute path to the staging app on the server
# Optional if staging uses same host and user as production:
#   HOSTINGER_HOST
#   HOSTINGER_USER
#   HOSTINGER_SSH_KEY
#   HOSTINGER_APP_PATH
# Optional:
#   HOSTINGER_PORT      SSH port (default 22)
#   STAGING_SITE_URL    base URL for post-deploy staging smoke test

name: Deploy Staging to Hostinger

on:
  push:
    branches: [staging]
  workflow_dispatch: []

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_STAGING_HOST || secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_STAGING_USER || secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_STAGING_SSH_KEY || secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            APP="${{ secrets.HOSTINGER_STAGING_APP_PATH || secrets.HOSTINGER_APP_PATH }}"
            if [ -z "$APP" ]; then
              echo "HOSTINGER_STAGING_APP_PATH secret is empty — set it in GitHub Secrets"
              exit 1
            fi
            cd "$APP"
            BRANCH=staging bash scripts/deploy.sh

      - name: Run staging smoke test
        run: |
          set -e
          URL="${{ secrets.STAGING_SITE_URL || 'https://staging.sleekbluemedia.com' }}"
          echo "Running staging smoke test against $URL/api/health"
          sleep 5
          curl -fsS "$URL/api/health"
